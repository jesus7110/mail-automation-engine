<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailFlow – Gmail Automation</title>
    <style>
        :root {
            --bg-dark: #0f0f1a;
            --text-primary: #f8f8ff;
            --text-secondary: #a0a0b0;
            --accent-blue: #4f6df5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .btn-connect {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 109, 245, 0.4);
        }

        .btn-connect svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">MailFlow</h1>
        <p class="subtitle">Multi-user Gmail monitoring with real-time push notifications</p>
        <a href="/auth/google" class="btn-connect">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 110-12.064c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0012.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z"/>
            </svg>
            Connect Gmail
        </a>
    </div>

    <script>
        // Redirect to dashboard if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const accessToken = localStorage.getItem('access_token');
            if (accessToken) {
                // Verify token is still valid
                fetch('/me', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        // Token expired, clear storage
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('user_id');
                    }
                }).catch(() => {
                    // Network error, stay on page
                });
            }
        });
    </script>
</body>
</html>
